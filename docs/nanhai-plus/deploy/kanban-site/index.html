<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南海 plus · 项目看板</title>
<style>
:root{--ink:#21364d;--muted:#6b7c90;--line:#dce4ee;--blue:#245fbb;--blue-soft:#eaf2ff;--green:#147363;--amber:#986012;--red:#b13b37;--amber-soft:#fff7e6;--green-soft:#e6f4f0}
*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #76a6e9;outline-offset:2px}button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 11px}button:hover{border-color:#97b0cd}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:400px}
.top{padding:15px 22px 12px;background:#152e49;color:#fff;display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}.top h1{margin:0;font-size:22px;letter-spacing:.5px}.top small{color:#b6cce5;font-size:12px}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top button{background:#274360;color:#fff;border-color:#4a6788}.connection{font-size:12px;color:#c6d9ed}.connection.warn{color:#ffd993}
.baseline{margin:12px 18px 0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:11px;padding:12px 16px;flex:none;font-size:13px}.baseline h2{margin:0 0 6px;font-size:14px;color:var(--blue)}.baseline .chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.baseline .chip{background:var(--blue-soft);border:1px solid #c9dcf2;border-radius:8px;padding:4px 10px;font-size:12px}.baseline .arrow{color:var(--muted)}.baseline .rel{color:var(--muted);font-size:12px;margin-top:6px}
.metrics{display:flex;gap:19px;flex-wrap:wrap;padding:10px 22px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.metrics b{font-size:17px;color:var(--ink);margin-right:4px}.metrics .attention b{color:var(--amber)}
.human-actions{margin:12px 18px 0;background:var(--amber-soft);border:1px solid #f0dcae;border-left:5px solid var(--amber);border-radius:11px;padding:14px 16px;flex:none}.human-actions h2{margin:0 0 8px;font-size:15px;color:#7a5410}.human-actions .todo-item{border-top:1px solid var(--f0e2bd);padding:9px 0}.human-actions .todo-item:first-of-type{border-top:none}.human-actions .todo-reason{color:#7a5410;font-size:12px}.human-actions .todo-action{color:var(--ink)}.human-actions .todo-rec{color:var(--muted);font-size:12px}.human-actions .none{color:var(--green);font-weight:600}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:14px;padding:14px 18px;min-height:0;flex:1}
.panel{min-width:0;min-height:0;background:#fff;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;overflow:hidden}.panel-header{padding:14px 15px 10px;border-bottom:1px solid var(--line);flex:none}.panel-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-title h2{margin:0;font-size:16px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:3px}.muted{color:var(--muted);font-size:12px}
.lane-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}.lane-status.ready{background:var(--green-soft);color:var(--green)}.lane-status.review{background:var(--blue-soft);color:var(--blue)}.lane-status.blocked{background:#fdecec;color:var(--red)}.lane-status.active{background:var(--blue-soft);color:var(--blue)}
.prep-note{font-size:11px;color:var(--muted);margin:8px 0 0;padding:7px 9px;background:#f8fafc;border-radius:7px;border-left:3px solid var(--blue)}
.col-scroll{overflow:auto;min-height:0;overscroll-behavior:contain;scrollbar-gutter:stable;padding:8px 10px 14px;flex:1}
.phase{margin-bottom:8px}.phase-head{display:flex;align-items:center;justify-content:space-between;padding:8px 7px 5px;font-size:12px;color:var(--muted)}.phase-head .bar{flex:1;height:6px;background:#edf1f7;border-radius:4px;margin-left:8px;overflow:hidden}.phase-head .bar i{display:block;height:100%;background:var(--blue)}
.step-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;margin:4px 0}.step-row:hover{border-color:#97b0cd}.step-row .num{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#edf1f7;color:var(--muted)}.step-row .lbl{flex:1;min-width:0}.step-row .lbl b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step-row .lbl small{color:var(--muted);font-size:11px}.step-row[aria-selected="true"]{background:var(--blue-soft);border-color:#9dbcec;border-left-color:var(--blue)}
.step-row.running-state{background:var(--green-soft)}.step-row[aria-selected="true"].running-state{background:linear-gradient(90deg,var(--blue-soft),var(--green-soft))}
.step-status{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:700;flex:none}.step-status.done{background:var(--green-soft);color:var(--green)}.step-status.active{background:var(--blue-soft);color:var(--blue)}.step-status.blocked{background:#fdecec;color:var(--red)}.step-status.waiting{background:#f1f5fb;color:var(--muted)}
.detail{padding:8px 10px 14px;overflow:auto;min-height:0;flex:1}.detail h3{margin:2px 0 4px;font-size:14px}.detail .kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12px;margin:6px 0}.detail .kv .k{color:var(--muted)}.sub-item{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0;background:#fbfcfe}.sub-item .sub-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}.sub-item .sub-id{font-size:12px;font-weight:600}.sub-item .sub-row{display:flex;gap:6px;font-size:12px;margin-top:2px}.sub-item .sub-row .lbl{color:var(--muted);flex:none;width:64px}
.empty{color:var(--muted);font-size:12px;padding:8px}.ev{font-size:11px;color:var(--blue);text-decoration:none}.ev:hover{text-decoration:underline}
.stale-banner{background:#b13b37;color:#fff;padding:8px 22px;font-size:13px;font-weight:600;text-align:center;display:none}.stale-banner.show{display:block}
@media(max-width:820px){.workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr)}.human-actions,.baseline{margin:10px 12px 0}}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div><h1>南海 plus · 项目看板</h1><small>Nanhai-plus progress · GZ02 public projection</small></div>
  <div class="top-actions">
    <span id="connection" class="connection">loading</span>
    <button id="refresh">刷新</button>
  </div>
</div>
<div id="stale-banner" class="stale-banner">数据已陈旧 · 最后更新 <span id="stale-time"></span> · 本地同步服务可能未运行</div>
<div id="baseline" class="baseline"></div>
<div class="metrics" id="metrics"></div>
<section id="human-actions" class="human-actions" aria-labelledby="human-actions-title"></section>
<div class="workspace">
  <div class="panel" id="musl-panel">
    <div class="panel-header">
      <div class="eyebrow">LANE 1</div>
      <div class="panel-title"><h2>Musl 历史参考</h2><span id="musl-lane-status" class="lane-status"></span></div>
      <div class="muted" id="musl-prep"></div>
    </div>
    <div class="col-scroll" id="musl-col"></div>
  </div>
  <div class="panel" id="bionic-panel">
    <div class="panel-header">
      <div class="eyebrow">LANE 2</div>
      <div class="panel-title"><h2>Bionic</h2><span id="bionic-lane-status" class="lane-status"></span></div>
      <div class="muted" id="bionic-prep"></div>
    </div>
    <div class="col-scroll" id="bionic-col"></div>
  </div>
  <div class="panel" id="detail-panel">
    <div class="panel-header">
      <div class="eyebrow">最后选中步骤分解</div>
      <div class="panel-title"><h2 id="detail-title">步骤详情</h2></div>
    </div>
    <div class="detail" id="detail-body"></div>
  </div>
</div>
</div>
<script>
const SEL_KEY='nanhai-kanban-gz02-sel';
let S=null, selected=null, refreshTimer=null;
const $=id=>document.getElementById(id);
const STATUS_LABEL={done:'done',active:'active',blocked:'blocked',waiting:'waiting'};
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadSel(){try{return JSON.parse(localStorage.getItem(SEL_KEY)||'null')}catch(e){return null}}
function saveSel(){try{localStorage.setItem(SEL_KEY,JSON.stringify(selected))}catch(e){}}
function statusClass(st){return st==='done'?'done':st==='active'?'active':st==='blocked'?'blocked':'waiting';}

const ENV_MAP={'01':['E00','E08','E10','E11','E12'],'02':['E03','E04','E05','E09'],'03':['E01','E02','E06','E07']};

function envSubSteps(stepId){
  const checks=(S.environment_gate&&S.environment_gate.checks)||[];
  return (ENV_MAP[stepId]||[]).map(id=>{
    const c=checks.find(x=>x.check_id===id);
    if(!c) return {id:id,title:id+' (no data)',status:'blocked',owner:'—',next:'等待收据',progress:'',evidence:null,observed_at:null};
    return {id:id,title:c.title,status:c.status,owner:c.owner||'—',next:c.next_action||'—',
      progress:c.verified_progress?'已核: '+c.verified_progress:'',evidence:c.evidence||null,observed_at:c.observed_at};
  });
}

function evLink(x){
  if(!x.evidence) return '';
  const name=String(x.evidence).split('/').pop();
  return '<div class="sub-row"><span class="lbl">证据</span><a class="ev" href="'+esc(x.evidence)+'" target="_blank">'+esc(name)+'</a>'+(x.observed_at?' <span class="muted">'+esc(String(x.observed_at).slice(0,16))+'</span>':'')+'</div>';
}

function lanePrep(laneKey){
  const lp=(S.lane_preparation||{})[laneKey];
  return lp||null;
}

function renderBaseline(){
  const box=$('baseline');
  const b=(S.public_baseline_summary||{}).bionic||{};
  let html='<h2>当前架构</h2><div class="chain">'+
    '<span class="chip">App 单 Bionic</span>'+
    '<span class="chip">'+esc(b.aosp||'AOSP16 R4')+'</span>'+
    '<span class="chip">'+esc(b.oh||'OH7.0.0.39')+'</span>'+
    '<span class="chip">'+esc(b.abi||'ARM64')+'</span></div>';
  html+='<div class="rel">历史 Musl 仅供适用事实对照，不是 Bionic 构建或启动前置；构建、扫描、测试及运行均禁止容器。</div>';
  box.innerHTML=html;
}

function renderHuman(){
  const box=$('human-actions');
  const hg=S.human_gates||[];
  const mg=S.management||{};
  const pending=mg.pending_user_decisions||[];
  let items=[];
  hg.forEach(g=>{
    if(g.status==='pending_user'||g.status==='waiting_user'){
      items.push({reason:g.reason||g.title||'',action:g.action||'',rec:g.recommendation||''});
    }
  });
  pending.forEach(d=>{
    items.push({reason:d.reason||d.title||'',action:d.action||d.decision_needed||'',rec:d.recommendation||''});
  });
  let html='<h2 id="human-actions-title">需要你做什么</h2>';
  if(items.length===0){
    html+='<div class="none">暂无待人工决策事项</div>';
  }else{
    items.forEach(it=>{
      html+='<div class="todo-item"><div class="todo-reason">'+esc(it.reason)+'</div>'+
        (it.action?'<div class="todo-action">'+esc(it.action)+'</div>':'')+
        (it.rec?'<div class="todo-rec">建议: '+esc(it.rec)+'</div>':'')+'</div>';
    });
  }
  box.innerHTML=html;
}

function renderMetrics(){
  const box=$('metrics');
  const p=S.progress||{};
  const m=S.management_metrics||S.management||{};
  const raw=m.metrics||m;
  let html='';
  if(Number.isInteger(p.target_stock_apk_cold_starts)){
    html+='<span><b>'+esc(p.stock_apk_cold_starts_verified)+'/'+esc(p.target_stock_apk_cold_starts)+'</b> 原包冷启动</span>'+
      '<span><b>'+esc(p.overseas_mainstream_blackbox_cold_starts_verified)+'/'+esc(p.target_overseas_mainstream_blackbox_cold_starts)+'</b> 海外主流黑盒冷启动</span>'+
      '<span><b>'+esc(p.accepted_raw_apk_artifact_identities)+'</b> 已收原包</span>'+
      '<span><b>'+esc(p.complete_host_static_inventories)+'</b> 完整宿主静态</span>'+
      '<span><b>'+esc(p.qualified_blackbox_test_packages)+'</b> 黑盒测试资格</span>'+
      '<span><b>'+esc(p.bionic_whole_tools_verified)+'/'+esc(p.original_tool_ids)+'</b> Bionic 整工具</span>';
  }
  if(Array.isArray(raw)){
    raw.forEach(x=>{html+='<span>'+esc(x)+'</span>';});
  }else if(typeof raw==='object'){
    Object.entries(raw).forEach(([k,v])=>{html+='<span><b>'+esc(v)+'</b> '+esc(k)+'</span>';});
  }
  if(S.checked_at) html+='<span>checked_at '+esc(String(S.checked_at).slice(0,19))+'</span>';
  if(S.updated_at) html+='<span>updated_at '+esc(String(S.updated_at).slice(0,19))+'</span>';
  if(S.dag_version) html+='<span>dag '+esc(S.dag_version)+'</span>';
  box.innerHTML=html;
}

function laneSteps(){
  const steps=S.steps||[];
  const shared=new Set(['01','02','03','17','18','19','20','21']);
  const musl=steps.filter(s=>shared.has(s.step_id)||s.lane==='lane-musl');
  const bionic=steps.filter(s=>shared.has(s.step_id)||s.lane==='lane-bionic'||s.lane==='lane-api');
  return {musl,bionic};
}

function subStepsFor(stepId){
  if(ENV_MAP[stepId]) return envSubSteps(stepId);
  const s=(S.steps||[]).find(x=>x.step_id===stepId);
  return [planSubStep(s||{step_id:stepId,status:'blocked'})];
}

function planSubStep(s){
  const dep=(s.blocked_by||[]).join(', ');
  return {id:s.step_id,title:s.title||s.step_id,status:s.status||'blocked',owner:s.owner||'—',
    progress:s.progress_scope?'产物/范围: '+s.progress_scope:'',
    next:s.next_action||('等待 '+dep+' 放行'),evidence:s.last_evidence||null,observed_at:null};
}

function renderLane(laneKey,colId,statusId,prepId){
  const col=$(colId);
  const {musl,bionic}=laneSteps();
  const list=laneKey==='lane-musl'?musl:bionic;
  const lp=lanePrep(laneKey);
  $(statusId).textContent=lp?(lp.status||'—'):'no data';
  $(statusId).className='lane-status '+(lp?(lp.status||''):'');
  $(prepId).textContent=lp?(lp.summary||''):'';
  let html='';
  const phases={};
  list.forEach(s=>{
    const p=s.phase||0;
    if(!phases[p]) phases[p]=[];
    phases[p].push(s);
  });
  Object.keys(phases).sort().forEach(p=>{
    const items=phases[p];
    const done=items.filter(s=>s.status==='done').length;
    html+='<div class="phase"><div class="phase-head"><span>Phase '+p+'</span><span class="bar"><i style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></i></span></div>';
    items.forEach(s=>{
      const stt=s.status||'waiting';
      const b=document.createElement('button');
      b.className='step-row'+(stt==='active'?' running-state':'');
      b.dataset.step=s.step_id;
      b.dataset.lane=laneKey;
      const isSel=selected&&selected.step_id===s.step_id&&selected.lane===laneKey;
      b.setAttribute('aria-selected',isSel?'true':'false');
      b.innerHTML='<span class="num">'+esc(s.step_id)+'</span><span class="lbl"><b>'+esc(s.title||s.step_id)+'</b><small>'+esc(s.owner||'')+'</small></span><span class="step-status '+statusClass(stt)+'">'+STATUS_LABEL[stt]+'</span>';
      b.onclick=()=>{
        selected={step_id:s.step_id,lane:laneKey};
        saveSel();
        document.querySelectorAll('.step-row').forEach(x=>{
          x.setAttribute('aria-selected',(selected&&x.dataset.step===selected.step_id&&x.dataset.lane===selected.lane)?'true':'false');
        });
        renderDetail();
      };
      col.appendChild(b);
    });
    html+='</div>';
  });
  if(list.length===0){
    col.innerHTML='<div class="empty">该 lane 暂无步骤数据</div>';
  }
}

function renderDetail(){
  const body=$('detail-body');
  if(!selected){
    body.innerHTML='<div class="empty">点击左侧步骤查看分解</div>';
    $('detail-title').textContent='步骤详情';
    return;
  }
  const s=(S.steps||[]).find(x=>x.step_id===(selected&&selected.step_id));
  if(!s){body.innerHTML='<div class="empty">步骤数据未找到</div>';return;}
  $('detail-title').textContent=s.title||s.step_id;
  const laneName=selected.lane==='lane-musl'?'Musl':'Bionic';
  let html='<h3>'+esc(s.step_id)+' · '+esc(s.title||'')+'</h3>';
  html+='<div class="kv"><span class="k">lane</span><span>'+esc(laneName)+'</span></div>';
  html+='<div class="kv"><span class="k">status</span><span class="step-status '+statusClass(s.status)+'">'+STATUS_LABEL[s.status]+'</span></div>';
  html+='<div class="kv"><span class="k">owner</span><span>'+esc(s.owner||'—')+'</span></div>';
  if(s.blocked_by&&s.blocked_by.length) html+='<div class="kv"><span class="k">blocked_by</span><span>'+esc(s.blocked_by.join(', '))+'</span></div>';
  if(s.next_action) html+='<div class="kv"><span class="k">下一动作</span><span>'+esc(s.next_action)+'</span></div>';
  if(s.last_evidence) html+='<div class="kv"><span class="k">证据</span><a class="ev" href="'+esc(s.last_evidence)+'" target="_blank">'+esc(String(s.last_evidence).split('/').pop())+'</a></div>';
  body.innerHTML=html;
  const lp=lanePrep(selected.lane);
  if(lp&&lp.checklist){
    const d=document.createElement('div');
    d.className='prep-note';
    d.textContent='lane checklist: '+lp.checklist.length+' items · '+lp.summary;
    body.appendChild(d);
  }
  subStepsFor(s.step_id).forEach(x=>{
    const d=document.createElement('div');
    d.className='sub-item';
    d.innerHTML='<div class="sub-head"><span class="sub-id">'+esc(x.id)+' · '+esc(x.title)+'</span><span class="step-status '+statusClass(x.status)+'">'+STATUS_LABEL[x.status]+'</span></div>'+
      '<div class="sub-row"><span class="lbl">owner</span>'+esc(x.owner)+'</div>'+
      (x.progress?'<div class="sub-row"><span class="lbl">已完成/方案</span>'+esc(x.progress)+'</div>':'')+
      '<div class="sub-row"><span class="lbl">下一动作</span>'+esc(x.next)+'</div>'+
      evLink(x);
    body.appendChild(d);
  });
}

function render(){
  renderBaseline();
  renderHuman();
  renderMetrics();
  $('musl-col').innerHTML='';
  $('bionic-col').innerHTML='';
  renderLane('lane-musl','musl-col','musl-lane-status','musl-prep');
  renderLane('lane-bionic','bionic-col','bionic-lane-status','bionic-prep');
  const saved=loadSel();
  const pairs=[];
  (S.steps||[]).forEach(s=>{pairs.push({step_id:s.step_id,lane:'lane-musl'});pairs.push({step_id:s.step_id,lane:'lane-bionic'});});
  if(saved && pairs.some(p=>p.step_id===saved.step_id&&p.lane===saved.lane)){
    selected=saved;
  } else {
    const first=(S.steps||[]).find(s=>s.status==='active');
    selected=first?{step_id:first.step_id,lane:'lane-musl'}:null;
  }
  renderDetail();
  document.querySelectorAll('.step-row').forEach(b=>{
    b.setAttribute('aria-selected',(selected && b.dataset.step===selected.step_id && b.dataset.lane===selected.lane)?'true':'false');
  });
}

async function load(){
  $('connection').textContent='loading';
  $('connection').className='connection';
  try{
    const r=await fetch('kanban-state.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    S=await r.json();
    $('stale-banner').className='stale-banner';
    $('connection').textContent='已连接 · '+(S.served_at||S.checked_at||'').slice(0,19);
    render();
  }catch(e){
    $('connection').textContent='断连 · '+new Date().toLocaleTimeString();
    $('connection').className='connection warn';
    const banner=$('stale-banner');
    banner.className='stale-banner show';
    $('stale-time').textContent=S?(S.checked_at||S.updated_at||'unknown'):'unknown';
    if(S) render();
  }
}

async function startRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer=setInterval(load,30000);
}
$('refresh').onclick=()=>{load();};
load();
startRefresh();
</script>
</body>
</html>
